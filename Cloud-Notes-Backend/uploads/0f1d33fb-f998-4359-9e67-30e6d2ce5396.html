<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function game(){
            const n = Math.floor(Math.random()*100)+1;
            let guess;
            while(1){
                guess = prompt("Guess the number form 1 - 100 :- ");
                if(n<guess) alert("too high!! , retyr = ");
                else if(n>guess) alert("too low!! , retyr = ");
                else {alert("cngratulations!!!");break}
            }
            if(confirm("want tp play again??")) game();
            else alert("thanks for playing!!");
        }
        game();
    </script>
</body>
</html>
