<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation Example</title>
</head>
<body>

    <h2 id="heading">Sample Page</h2>

    <ul>
        <li class="special-item">Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <button onclick="val()">Main Button A</button>
    <button>Button B</button>
    <button>Button C</button>

    <p>This is paragraph one.</p>
    <p>This is paragraph two.</p>

    <p class="change-me">Original text of special paragraph.</p>

    <script>
        function val(){
            document.getElementById("heading").style.backgroundColor = "yellow";

        document.querySelectorAll("li").forEach(li => li.style.color = "blue");

        document.querySelectorAll("button").forEach(btn =>
            btn.textContent = "Clicked!"
        );

        document.querySelectorAll("p").forEach(p =>
            p.style.fontSize = "20px"
        );

        document.querySelector(".change-me").textContent = "This text has been changed!";
        }

    </script>

</body>
</html>
