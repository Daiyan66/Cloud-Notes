<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program 22</title>
</head>
<body>
    <form>
        Username :- 
        <input type="text" id="uname">
        <p id="unameerr" style="color:red;"></p>

        Email :-
        <input type="email" id="email">
        <p id="emailerr" style="color:red;"></p>

        Mobile Num :-
        <input type="text" id="mobile">
        <p id="mobileerr" style="color:red;"></p>

        Password:-
        <input type="password" id="pass">   
        <p id="passerr" style="color:red;"></p>

        Confirm Password :-
        <input type="password" id="conpass">
        <p id="conpasserr" style="color:red;"></p>

        Select Branch :-
        <select name="branch" id="branch">
            <option value="">--Select--</option>
            <option>CS</option>
            <option>IS</option>
            <option>AIML</option>
        </select>
        <p id="brancherr" style="color:red;"></p>

        Profile Pic:-
        <input type="file" id="pic" >
        <p id="picerr" style="color:red;"></p>

        <button type="button" id="register" onclick="validate()">Register</button>
        <button type="reset" id="reset">Reset</button>
    </form>

    <br><br>

    <div id="card" style="display:none;border:2px solid black;padding:10px;width:300px;">
        <img id="img" style="width:100px;height:100px;">     
        <br><br>
        Name:- <p id="cname"></p>
        Email:- <p id="cemail"></p>
        Mobile:- <p id="cmobile"></p>
        Branch:- <p id="cbranch"></p>
    </div>

    <script>
        function validate(){
            

            let user = document.getElementById('uname').value.trim();
            let email = document.getElementById('email').value.trim();
            let mobile = document.getElementById('mobile').value.trim();
            let pass = document.getElementById('pass').value;
            let conpass = document.getElementById('conpass').value;
            let branch = document.getElementById('branch').value;
            let pic = document.getElementById('pic').files[0];

            let ok = true;

            if(user.length < 6){
                document.getElementById('unameerr').innerHTML = "At least 6 characters required!!";
                ok = false;
            }

            if(pass !== conpass){
                document.getElementById('conpasserr').innerHTML = "Password does not match!!";
                ok = false;
            }

            if(branch === ""){
                document.getElementById('brancherr').innerHTML = "Please select a branch!!";
                ok = false;
            }

            if(!pic){
                document.getElementById('picerr').innerHTML = "Please upload a pic!!";
                ok = false;
            }

            if(!/[a-zA-Z]/.test(pass) || !/[0-9]/.test(pass)){
                document.getElementById('passerr').innerHTML = "Password must contain letters and numbers!!";
                ok = false;
            }

            if(!/^[0-9]{10}$/.test(mobile)){
                document.getElementById('mobileerr').innerHTML = "10 digits required!!!";
                ok = false;
            }

            if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
                document.getElementById('emailerr').innerHTML = "Invalid email!!!";
                ok = false;
            }

            if(!ok) return;

            // Display user details
            document.getElementById("cname").innerHTML = user;
            document.getElementById("cemail").innerHTML = email;
            document.getElementById("cmobile").innerHTML = mobile;
            document.getElementById("cbranch").innerHTML = branch;

            // Display profile picture
            let reader = new FileReader();
            reader.onload = function(e){
                document.getElementById('img').src = e.target.result;
            };
            reader.readAsDataURL(pic);
            

            document.getElementById('card').style.display = 'block';
        }
    </script>
</body>
</html>
