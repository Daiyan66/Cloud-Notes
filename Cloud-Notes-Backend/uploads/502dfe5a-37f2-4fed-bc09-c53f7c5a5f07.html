<!-- Design a webpage using HTML that meets the following requirements:
1. Create a table as shown below.
2. The first row of the table should include the headers: "Column 1", "Column 2"and "Column 3".
3. Add two additional rows with sample data under these headers.
4. Use inline CSS to:
a. Add a border to the table and its cells.
b. Center-align all the text within the table -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prog -2</title>
    <style>
        td,th{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <table style="border: 2px solid black; text-align: center;width: 650px;">
        <tr>
            <th>Col 1</th>
            <th>Col 2</th>
            <th>Col 3</th>
        </tr>
        <tr>
            <td rowspan="2">Row 1</td>
            <td>Row 2</td>
            <td>Row 3</td>
        </tr>
        <tr>
            <td>Row 1</td>
            <td>Row 2</td>
        </tr>
        <tr>
            <td colspan="3">Row 1</td>
        </tr>
    </table>
</body>
</html>
