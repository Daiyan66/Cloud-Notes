<body style="justify-items: center;">
    <form style="border: 2px solid black; width: 300px;padding: 5px">
        <h1>User Information</h1>
    <label for="name">name</label>

    <label for="email">email</label>
    <input type="email" name="email"><br><br>

    <label for="age">age</label>

    <label for="country">Country</label>
    <select name="country">
        <option value="India">India</option>
        <option value="France">France</option>
        <option value="England">England</option>
    </select><br><br>

    <label for="password">password</label>
    <input type="password" name="password"><br><br>

    <label for="file">file</label>
    <input type="file" name="file"><br><br>

    <p>Select a sport</p>
    <label for="sports">Chess</label>

    <label for="file">snake and ladder</label>
    <input type="checkbox" name="sports"><br><br>

    <p>Select Gender</p>
    <label for="gender">Male</label>
    <input type="radio" name="gender">
    <label for="gender">Female</label>
    <input type="radio" name="gender"><br><br>

    <label for="city">City</label>
    <select name="city">
        <option value="choose City">--choose City--</option>
        <option value="Mysore">Mysore</option>
        <option value="Mandya">Mandya</option>
        <option value="Baglore">Baglore</option>
    </select><br><br>
    <label for="address">Enter address</label><br>
    <textarea name="address" ></textarea><br><br>
    
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    </form>


</body>
