server:
  port: 8085
  servlet:
    context-path: /api

spring:
  application:
    name: cloudnotes-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cloudnotes_db}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  storage:
    type: ${STORAGE_TYPE:local} # local or s3
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  ai:
    provider: ${AI_PROVIDER:mock} # mock, gemini, or openai
    api-key: ${AI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@cloudnotes.edu}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@CloudNotes2026}
    admin-name: ${SEED_ADMIN_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
